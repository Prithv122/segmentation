name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies (CPU torch)
        run: uv sync --all-groups --all-extras

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest --cov=src --cov-report=term-missing

      - name: Train a tiny U-Net on CPU
        run: uv run pytest -m slow

      - name: Leakage audit and results summary from committed files
        run: |
          if [ -f data/manifest.csv ]; then uv run segment audit; fi
          if ls results/per_chip_*.csv >/dev/null 2>&1; then uv run segment eval --results results > /dev/null; git diff --exit-code results/; fi
